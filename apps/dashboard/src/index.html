<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Dashboard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
</head>
<body class="mat-typography">
<script type="text/javascript">
  // Storing any query parameters before Anguler removes them
  const queryString = location.search;
  let params = new URLSearchParams(queryString);
  if (typeof window !== 'undefined') {
    let repoName='default';
    if (location.pathname?.indexOf('repo/')!==-1) {
      repoName=location.pathname.substring(location.pathname.indexOf('repo/')+5);
      if (repoName.endsWith('/')) repoName=repoName.substring(0,repoName.length-1);
    }
    window.dashboardConfig =
      {
        action:params.get("action"),
        repo:repoName
      }
  }
  // console.log("Request =",window.dontCodeId);
</script>

  <app-root></app-root>
</body>
</html>
